  backend:
    build: ./backend
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: ${NODE_ENV}
      KAFKA_BROKER: kafka:9092
      POSTGRES_URL: ${POSTGRES_URL}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - kafka
      - postgres
      - mongo
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - backend

