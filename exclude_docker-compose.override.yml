services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - TURBOPACK_WATCH_POLL=true
    command: npm run dev -- --port 3005 --turbo
